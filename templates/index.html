<!DOCTYPE html>
<html lang="my" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus OCR Studio</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    
    <style>
        :root {
            --bg-grad-1: #090d16;
            --bg-grad-2: #111827;
            --surface: rgba(30, 41, 59, 0.65);
            --surface-hover: rgba(51, 65, 85, 0.75);
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(99, 102, 241, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --primary-solid: #6366f1;
            --primary-hover: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --danger: #f43f5e;
            --success: #10b981;
            --radius-card: 24px;
            --radius-element: 14px;
            --shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        [data-theme="light"] {
            --bg-grad-1: #f8fafc;
            --bg-grad-2: #e2e8f0;
            --surface: rgba(255, 255, 255, 0.75);
            --surface-hover: rgba(255, 255, 255, 0.95);
            --border: rgba(0, 0, 0, 0.08);
            --border-focus: rgba(79, 70, 229, 0.4);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary-grad: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
            --primary-solid: #4f46e5;
            --primary-hover: #4338ca;
            --accent-glow: rgba(79, 70, 229, 0.15);
            --shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* Glass Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1.2rem;
            background: var(--primary-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-icon {
            font-size: 1.5rem;
            background: var(--primary-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-tools {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        /* Modern Glass Buttons */
        button, .btn {
            background: var(--surface);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.65rem 1.25rem;
            border-radius: var(--radius-element);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            backdrop-filter: blur(10px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:hover {
            background: var(--surface-hover);
            border-color: var(--border-focus);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-primary {
            background: var(--primary-grad);
            color: white;
            border: none;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-primary:hover {
            opacity: 0.95;
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .btn.active-preset {
            background: var(--primary-solid);
            color: white;
            border-color: var(--primary-solid);
        }

        /* Bento Grid Main Layout */
        main {
            flex: 1;
            padding: 2rem;
            max-width: 1500px;
            width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media(min-width: 1024px) {
            main {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Glass Bento Cards */
        .bento-card {
            background: var(--surface);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 1.75rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            transition: border-color 0.3s ease;
        }

        .bento-card:hover {
            border-color: var(--border-focus);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .card-title i {
            color: var(--primary-solid);
        }

        /* Dropzone Styling */
        .dropzone {
            border: 2px dashed var(--border);
            border-radius: var(--radius-element);
            padding: 3rem 1.5rem;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.01);
            transition: all 0.3s;
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--primary-solid);
            background: var(--accent-glow);
        }

        .dropzone i {
            font-size: 2.75rem;
            background: var(--primary-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .preview-box {
            position: relative;
            display: none;
            width: 100%;
            max-height: 380px;
            background: #000;
            border-radius: var(--radius-element);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .preview-box img {
            width: 100%;
            height: auto;
            max-height: 380px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .preview-actions {
            display: flex;
            gap: 0.5rem;
        }

        /* Controls & Inputs */
        .controls-row {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
        }

        select, input[type="text"] {
            background: var(--surface);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.75rem 1rem;
            border-radius: var(--radius-element);
            outline: none;
            flex: 1;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        select:focus, input[type="text"]:focus, textarea:focus {
            border-color: var(--primary-solid);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        textarea {
            width: 100%;
            height: 230px;
            background: var(--surface);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: var(--radius-element);
            padding: 1rem;
            resize: vertical;
            outline: none;
            font-size: 0.95rem;
            line-height: 1.6;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .stats-bar {
            display: flex;
            gap: 1.25rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            flex-wrap: wrap;
        }

        /* AI Interactive Grid */
        .ai-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 0.75rem;
        }

        .ai-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-element);
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            transition: all 0.25s;
        }

        .ai-card:hover {
            border-color: var(--primary-solid);
            background: var(--surface-hover);
            transform: translateY(-2px);
        }

        .ai-card i {
            font-size: 1.3rem;
            background: var(--primary-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Sleek Modals */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
            padding: 1rem;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--bg-grad-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow);
            animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalPop {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            padding: 1.25rem 1.75rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            padding: 1.25rem 1.75rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        /* Phone Editor Toolbar */
        .phone-editor-toolbar {
            display: flex;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            align-items: center;
        }

        /* Toast Container */
        #toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 2000;
        }

        .toast {
            background: var(--surface);
            backdrop-filter: blur(20px);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.85rem 1.25rem;
            border-radius: var(--radius-element);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: 0.9rem;
        }

        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Glass Header -->
    <header>
        <div class="logo-area">
            <i class="fa-solid fa-wand-magic-sparkles logo-icon"></i>
            <span>Nexus OCR Studio</span>
        </div>
        <div class="header-tools">
            <button id="btn-theme" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
        </div>
    </header>

    <!-- Bento Grid Main Container -->
    <main>
        <!-- Card 1: Image Input & OCR Engine -->
        <div class="bento-card">
            <div class="card-header">
                <div class="card-title"><i class="fa-solid fa-image"></i> Source Image Input</div>
            </div>

            <div id="dropzone" class="dropzone">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <div>
                    <p style="font-weight: 600; margin-bottom: 0.25rem;">Drop your image here or browse</p>
                    <span style="font-size: 0.85rem; color: var(--text-muted);">Supports PNG, JPG, WEBP</span>
                </div>
                <input type="file" id="file-input" accept="image/*" style="display: none;">
            </div>

            <div id="preview-box" class="preview-box">
                <img id="image-preview" src="" alt="Preview">
            </div>

            <div class="preview-actions" id="preview-actions" style="display: none;">
                <button id="btn-crop-modal" class="btn"><i class="fa-solid fa-crop-simple"></i> Edit / Crop</button>
                <button id="btn-remove-image" class="btn" style="color: var(--danger);"><i class="fa-solid fa-trash"></i> Remove</button>
            </div>

            <div class="controls-row" style="margin-top: auto;">
                <select id="select-lang">
                    <option value="mya">Myanmar (မြန်မာ)</option>
                    <option value="eng">English</option>
                    <option value="mya+eng">Myanmar + English</option>
                </select>
                <button id="btn-scan" class="btn btn-primary" style="flex: 1;">
                    <i class="fa-solid fa-bolt"></i>
                    <span id="scan-btn-text">Extract Text (OCR)</span>
                </button>
            </div>
        </div>

        <!-- Card 2: Extracted Text Editor & AI Studio -->
        <div class="bento-card">
            <div class="card-header">
                <div class="card-title"><i class="fa-solid fa-pen-nib"></i> Text Workspace & AI</div>
            </div>

            <textarea id="editor-text" placeholder="Extracted text or translated output will appear here..."></textarea>
            
            <div class="stats-bar">
                <span id="stat-words">Words: 0</span>
                <span id="stat-chars">Characters: 0</span>
                <span id="stat-mya-chars">Myanmar Chars: 0</span>
            </div>

            <div class="controls-row" style="justify-content: space-between;">
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    <button id="btn-copy" class="btn" title="Copy"><i class="fa-solid fa-copy"></i> Copy</button>
                    <button id="btn-speak" class="btn" title="Read Aloud"><i id="speaker-icon" class="fa-solid fa-volume-high"></i></button>
                    <button id="btn-clear-text" class="btn" style="color: var(--danger);" title="Clear"><i class="fa-solid fa-eraser"></i></button>
                </div>
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    <button id="btn-export-txt" class="btn">.TXT</button>
                    <button id="btn-export-docx" class="btn">.DOCX</button>
                    <button id="btn-export-pdf" class="btn">.PDF</button>
                </div>
            </div>

            <!-- AI Quick Tools -->
            <div style="border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.75rem;">
                <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">AI Intelligence Actions</span>
                <div class="ai-grid">
                    <div class="ai-card" data-action="summarize"><i class="fa-solid fa-compress"></i><span>Summarize</span></div>
                    <div class="ai-card" data-action="translate_en"><i class="fa-solid fa-language"></i><span>To English</span></div>
                    <div class="ai-card" data-action="translate_my"><i class="fa-solid fa-globe"></i><span>To Myanmar</span></div>
                    <div class="ai-card" data-action="grammar"><i class="fa-solid fa-spell-check"></i><span>Grammar Fix</span></div>
                </div>
                <div class="controls-row">
                    <input type="text" id="ai-custom-prompt" placeholder="Ask AI anything about this text...">
                    <button id="btn-ai-submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </main>

    <!-- Phone-Style Photo Editor Modal -->
    <div id="modal-crop" class="modal">
        <div class="modal-content" style="max-width: 750px;">
            <div class="modal-header">
                <h3><i class="fa-solid fa-sliders"></i> Phone Photo Editor</h3>
                <button id="btn-close-crop" class="btn" style="border:none;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <!-- Phone Editor Toolbar (Aspect ratios, rotate, flip) -->
            <div class="phone-editor-toolbar">
                <button class="btn aspect-btn active-preset" data-ratio="NaN">Free</button>
                <button class="btn aspect-btn" data-ratio="1">1:1</button>
                <button class="btn aspect-btn" data-ratio="1.33333">4:3</button>
                <button class="btn aspect-btn" data-ratio="1.77777">16:9</button>
                <div style="width: 1px; height: 24px; background: var(--border); margin: 0 0.25rem;"></div>
                <button id="btn-rotate-left" class="btn" title="Rotate Left"><i class="fa-solid fa-rotate-left"></i></button>
                <button id="btn-rotate-right" class="btn" title="Rotate Right"><i class="fa-solid fa-rotate-right"></i></button>
                <button id="btn-flip-h" class="btn" title="Flip Horizontal"><i class="fa-solid fa-arrows-left-right"></i></button>
                <button id="btn-flip-v" class="btn" title="Flip Vertical"><i class="fa-solid fa-arrows-up-down"></i></button>
                <button id="btn-reset-crop" class="btn" title="Reset"><i class="fa-solid fa-rotate"></i></button>
            </div>

            <div class="modal-body" style="padding: 0; background: #000; max-height: 55vh;">
                <img id="cropper-image" src="" style="max-width: 100%; display: block;">
            </div>
            <div class="modal-footer">
                <button id="btn-cancel-crop" class="btn">Cancel</button>
                <button id="btn-apply-crop" class="btn btn-primary"><i class="fa-solid fa-check"></i> Apply Changes</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Cropper.js Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <!-- App Logic Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const state = {
                theme: localStorage.getItem('nexus_theme') || 'dark',
                imageBlob: null,
                imageURL: null,
                cropper: null,
                isSpeaking: false,
                scaleXVal: 1,
                scaleYVal: 1
            };

            const el = {
                html: document.documentElement,
                btnTheme: document.getElementById('btn-theme'),
                dropzone: document.getElementById('dropzone'),
                fileInput: document.getElementById('file-input'),
                previewBox: document.getElementById('preview-box'),
                imagePreview: document.getElementById('image-preview'),
                previewActions: document.getElementById('preview-actions'),
                btnRemoveImage: document.getElementById('btn-remove-image'),
                btnScan: document.getElementById('btn-scan'),
                scanBtnText: document.getElementById('scan-btn-text'),
                selectLang: document.getElementById('select-lang'),
                
                editorText: document.getElementById('editor-text'),
                statWords: document.getElementById('stat-words'),
                statChars: document.getElementById('stat-chars'),
                statMyaChars: document.getElementById('stat-mya-chars'),
                btnCopy: document.getElementById('btn-copy'),
                btnSpeak: document.getElementById('btn-speak'),
                speakerIcon: document.getElementById('speaker-icon'),
                btnClearText: document.getElementById('btn-clear-text'),
                btnExportTxt: document.getElementById('btn-export-txt'),
                btnExportDocx: document.getElementById('btn-export-docx'),
                btnExportPdf: document.getElementById('btn-export-pdf'),
                
                aiCards: document.querySelectorAll('.ai-card'),
                aiCustomPrompt: document.getElementById('ai-custom-prompt'),
                btnAiSubmit: document.getElementById('btn-ai-submit'),
                
                modalCrop: document.getElementById('modal-crop'),
                btnCropModal: document.getElementById('btn-crop-modal'),
                cropperImage: document.getElementById('cropper-image'),
                btnCloseCrop: document.getElementById('btn-close-crop'),
                btnCancelCrop: document.getElementById('btn-cancel-crop'),
                aspectBtns: document.querySelectorAll('.aspect-btn'),
                btnRotateLeft: document.getElementById('btn-rotate-left'),
                btnRotateRight: document.getElementById('btn-rotate-right'),
                btnFlipH: document.getElementById('btn-flip-h'),
                btnFlipV: document.getElementById('btn-flip-v'),
                btnResetCrop: document.getElementById('btn-reset-crop'),
                btnApplyCrop: document.getElementById('btn-apply-crop'),
                
                toastContainer: document.getElementById('toast-container')
            };

            // Theme Init
            el.html.setAttribute('data-theme', state.theme);
            updateThemeIcon();

            el.btnTheme.addEventListener('click', () => {
                state.theme = state.theme === 'dark' ? 'light' : 'dark';
                localStorage.setItem('nexus_theme', state.theme);
                el.html.setAttribute('data-theme', state.theme);
                updateThemeIcon();
            });

            function updateThemeIcon() {
                el.btnTheme.innerHTML = state.theme === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
            }

            function showToast(msg, type = 'success') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i><span>${msg}</span>`;
                el.toastContainer.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            // File Upload & Drag Drop
            el.dropzone.addEventListener('click', () => el.fileInput.click());
            el.dropzone.addEventListener('dragover', (e) => { e.preventDefault(); el.dropzone.classList.add('dragover'); });
            el.dropzone.addEventListener('dragleave', () => el.dropzone.classList.remove('dragover'));
            el.dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                el.dropzone.classList.remove('dragover');
                if (e.dataTransfer.files?.[0]) handleFile(e.dataTransfer.files[0]);
            });
            el.fileInput.addEventListener('change', (e) => {
                if (e.target.files?.[0]) handleFile(e.target.files[0]);
            });

            function handleFile(file) {
                if (!file.type.startsWith('image/')) return showToast('Please select a valid image file', 'error');
                state.imageBlob = file;
                if (state.imageURL) URL.revokeObjectURL(state.imageURL);
                state.imageURL = URL.createObjectURL(file);

                el.imagePreview.src = state.imageURL;
                el.dropzone.style.display = 'none';
                el.previewBox.style.display = 'block';
                el.previewActions.style.display = 'flex';
                showToast('Image uploaded successfully');
            }

            // Remove Image & Clear Workspace & AI Inputs
            el.btnRemoveImage.addEventListener('click', () => {
                state.imageBlob = null;
                if (state.imageURL) URL.revokeObjectURL(state.imageURL);
                el.imagePreview.src = '';
                el.previewBox.style.display = 'none';
                el.previewActions.style.display = 'none';
                el.dropzone.style.display = 'flex';
                el.fileInput.value = '';

                // Clear Workspace & AI outputs
                el.editorText.value = '';
                updateStats();
                if (el.aiCustomPrompt) el.aiCustomPrompt.value = '';

                showToast('Image and workspace cleared', 'error');
            });

            // Phone Editor Modal Init
            el.btnCropModal.addEventListener('click', () => {
                if (!state.imageURL) return;
                el.cropperImage.src = state.imageURL;
                el.modalCrop.classList.add('active');
                if (state.cropper) state.cropper.destroy();
                state.scaleXVal = 1;
                state.scaleYVal = 1;
                state.cropper = new Cropper(el.cropperImage, { viewMode: 1, autoCropArea: 0.9 });
            });

            function closeCrop() {
                el.modalCrop.classList.remove('active');
                if (state.cropper) { state.cropper.destroy(); state.cropper = null; }
            }
            el.btnCloseCrop.addEventListener('click', closeCrop);
            el.btnCancelCrop.addEventListener('click', closeCrop);

            // Aspect Ratio presets
            el.aspectBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    el.aspectBtns.forEach(b => b.classList.remove('active-preset'));
                    btn.classList.add('active-preset');
                    const ratio = parseFloat(btn.getAttribute('data-ratio'));
                    state.cropper?.setAspectRatio(ratio);
                });
            });

            el.btnRotateLeft.addEventListener('click', () => state.cropper?.rotate(-90));
            el.btnRotateRight.addEventListener('click', () => state.cropper?.rotate(90));
            
            el.btnFlipH.addEventListener('click', () => {
                state.scaleXVal = state.scaleXVal * -1;
                state.cropper?.scaleX(state.scaleXVal);
            });
            el.btnFlipV.addEventListener('click', () => {
                state.scaleYVal = state.scaleYVal * -1;
                state.cropper?.scaleY(state.scaleYVal);
            });

            el.btnResetCrop.addEventListener('click', () => {
                state.scaleXVal = 1;
                state.scaleYVal = 1;
                state.cropper?.reset();
            });

            el.btnApplyCrop.addEventListener('click', () => {
                if (!state.cropper) return;
                state.cropper.getCroppedCanvas().toBlob((blob) => {
                    state.imageBlob = blob;
                    if (state.imageURL) URL.revokeObjectURL(state.imageURL);
                    state.imageURL = URL.createObjectURL(blob);
                    el.imagePreview.src = state.imageURL;
                    closeCrop();
                    showToast('Photo edits applied successfully');
                }, 'image/jpeg', 0.95);
            });

            // OCR Extraction Request & Validation Logic
            el.btnScan.addEventListener('click', async () => {
                if (!state.imageBlob) return showToast('Please upload an image first', 'error');

                const selectedLang = el.selectLang.value;
                setLoading(el.btnScan, el.scanBtnText, true, 'Extracting OCR...');
                const formData = new FormData();
                formData.append('file', state.imageBlob);
                formData.append('lang', selectedLang);

                try {
                    const res = await fetch('/ocr', { method: 'POST', body: formData });
                    const data = await res.json();
                    if (res.ok && data.text !== undefined) {
                        const text = data.text.trim();
                        const hasMyanmar = /[\u1000-\u109F]/.test(text);

                        // Language Validation Check
                        if (selectedLang === 'mya') {
                            if (!hasMyanmar || text === '') {
                                showToast('Error: Selected Myanmar, but no Myanmar text found in image!', 'error');
                                el.editorText.value = '';
                                updateStats();
                                return;
                            }
                        } else if (selectedLang === 'eng') {
                            if (hasMyanmar) {
                                showToast('Error: Selected English, but Myanmar text was detected!', 'error');
                                el.editorText.value = '';
                                updateStats();
                                return;
                            }
                        }
                        // For 'mya+eng', both or either is allowed.

                        el.editorText.value = text;
                        updateStats();
                        showToast('Text extracted successfully!');
                    } else {
                        showToast(data.error || 'OCR extraction failed', 'error');
                    }
                } catch (err) {
                    showToast('Server connection error', 'error');
                } finally {
                    setLoading(el.btnScan, el.scanBtnText, false, 'Extract Text (OCR)');
                }
            });

            // Editor Stats & Actions
            el.editorText.addEventListener('input', updateStats);
            function updateStats() {
                const text = el.editorText.value;
                el.statWords.textContent = `Words: ${text.trim() ? text.trim().split(/\s+/).length : 0}`;
                el.statChars.textContent = `Characters: ${text.length}`;
                el.statMyaChars.textContent = `Myanmar Chars: ${(text.match(/[\u1000-\u109F]/g) || []).length}`;
            }

            el.btnCopy.addEventListener('click', () => {
                if (!el.editorText.value) return;
                navigator.clipboard.writeText(el.editorText.value);
                showToast('Copied to clipboard!');
            });

            el.btnClearText.addEventListener('click', () => {
                el.editorText.value = '';
                updateStats();
                showToast('Editor cleared', 'error');
            });

            // Text-To-Speech
            el.btnSpeak.addEventListener('click', () => {
                if (!('speechSynthesis' in window)) return showToast('TTS not supported', 'error');
                if (state.isSpeaking) {
                    window.speechSynthesis.cancel();
                    state.isSpeaking = false;
                    el.speakerIcon.className = 'fa-solid fa-volume-high';
                    return;
                }
                const text = el.editorText.value;
                if (!text) return showToast('No text available to read', 'error');

                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = /[\u1000-\u109F]/.test(text) ? 'my-MM' : 'en-US';
                utter.onstart = () => { state.isSpeaking = true; el.speakerIcon.className = 'fa-solid fa-stop'; };
                utter.onend = () => { state.isSpeaking = false; el.speakerIcon.className = 'fa-solid fa-volume-high'; };
                window.speechSynthesis.speak(utter);
            });

            // Exports
            el.btnExportTxt.addEventListener('click', () => exportFile('/export/txt', 'txt'));
            el.btnExportDocx.addEventListener('click', () => exportFile('/export/docx', 'docx'));
            el.btnExportPdf.addEventListener('click', () => exportFile('/export/pdf', 'pdf'));

            async function exportFile(endpoint, ext) {
                const text = el.editorText.value;
                if (!text) return showToast('No text to export', 'error');
                try {
                    const res = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text })
                    });
                    if (!res.ok) throw new Error();
                    const blob = await res.blob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Export_${Date.now()}.${ext}`;
                    a.click();
                    URL.revokeObjectURL(url);
                    showToast(`Exported as ${ext.toUpperCase()}`);
                } catch {
                    showToast(`Failed to export ${ext.toUpperCase()}`, 'error');
                }
            }

            // AI Actions
            el.aiCards.forEach(card => {
                card.addEventListener('click', () => triggerAI(card.getAttribute('data-action')));
            });

            el.btnAiSubmit.addEventListener('click', () => {
                const prompt = el.aiCustomPrompt.value.trim();
                if (!prompt) return showToast('Please enter a prompt', 'error');
                triggerAI('ask', prompt);
            });

            async function triggerAI(action, customPrompt = '') {
                const text = el.editorText.value.trim();
                if (!text) return showToast('Please provide text in the workspace first', 'error');

                let payloadAction = action, targetLang = '', prompt = customPrompt;
                if (action === 'translate_en') { payloadAction = 'translate'; targetLang = 'en'; }
                else if (action === 'translate_my') { payloadAction = 'translate'; targetLang = 'my'; }
                else if (action === 'grammar') { payloadAction = 'explain'; prompt = 'Fix spelling and grammar mistakes in the text.'; }

                showToast('AI is processing...', 'success');
                try {
                    const res = await fetch('/ai/process', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: payloadAction, text, target_lang: targetLang, prompt })
                    });
                    const data = await res.json();
                    if (res.ok && data.result) {
                        el.editorText.value = data.result;
                        updateStats();
                        showToast('AI response applied successfully!');
                    } else {
                        showToast(data.error || 'AI processing failed', 'error');
                    }
                } catch {
                    showToast('AI service connection error', 'error');
                }
            }

            function setLoading(btn, labelSpan, loading, text) {
                btn.disabled = loading;
                labelSpan.textContent = text;
                if (loading) {
                    const spinner = document.createElement('div');
                    spinner.className = 'spinner';
                    btn.prepend(spinner);
                } else {
                    btn.querySelector('.spinner')?.remove();
                }
            }
        });
    </script>
</body>
</html>
