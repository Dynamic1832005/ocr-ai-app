<!DOCTYPE html>
<html lang="my" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR Scanner & AI Text Suite</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6.4.0 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-surface: #ffffff;
            --bg-secondary: #f1f5f9;
            --border-color: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent-primary: #2563eb;
            --accent-primary-hover: #1d4ed8;
            --accent-danger: #ef4444;
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --radius-md: 10px;
            --radius-lg: 16px;
            --font-main: 'Plus Jakarta Sans', 'Padauk', sans-serif;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-surface: #1e293b;
            --bg-secondary: #334155;
            --border-color: #475569;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --accent-primary: #3b82f6;
            --accent-primary-hover: #60a5fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }

        .navbar {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-primary);
        }

        .btn-icon {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-icon:hover {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
        }

        .btn {
            padding: 0.65rem 1.25rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
            transition: var(--transition);
            font-family: var(--font-main);
        }

        .btn-primary { background-color: var(--accent-primary); color: #fff; }
        .btn-primary:hover { background-color: var(--accent-primary-hover); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-secondary { background-color: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background-color: var(--border-color); }

        .container {
            max-width: 1400px;
            margin: 1.5rem auto;
            padding: 0 1.5rem;
            width: 100%;
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 1.5rem;
            flex: 1;
        }

        .panel {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .dropzone {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-md);
            padding: 2rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background-color: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--accent-primary);
            background-color: rgba(37, 99, 235, 0.05);
        }

        .dropzone i { font-size: 2.5rem; color: var(--accent-primary); }

        .preview-container {
            position: relative;
            width: 100%;
            max-height: 250px;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: none;
            background-color: #000;
        }

        .preview-container img {
            width: 100%;
            height: 250px;
            object-fit: contain;
        }

        .preview-overlay {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 6px;
        }

        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-label { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); }

        .form-select, .form-input {
            width: 100%;
            padding: 0.65rem 0.9rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background-color: var(--bg-surface);
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 0.9rem;
            outline: none;
        }

        .workbench { display: flex; flex-direction: column; gap: 1rem; flex: 1; }

        .tabs { display: flex; gap: 0.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }

        .tab-btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: var(--font-main);
        }

        .tab-btn.active { background-color: var(--accent-primary); color: #fff; }

        .tab-content { display: none; flex-direction: column; gap: 1rem; flex: 1; }
        .tab-content.active { display: flex; }

        .editor-textarea {
            width: 100%;
            min-height: 350px;
            flex: 1;
            padding: 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background-color: var(--bg-surface);
            color: var(--text-primary);
            font-family: 'Padauk', var(--font-main);
            font-size: 1.05rem;
            line-height: 1.8;
            resize: vertical;
            outline: none;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            background-color: var(--bg-secondary);
            padding: 0.75rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .toolbar-group { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }

        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 1.25rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .ai-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.75rem;
        }

        .ai-card {
            border: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            padding: 0.9rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: var(--transition);
        }

        .ai-card:hover {
            border-color: var(--accent-primary);
            background-color: var(--bg-surface);
        }

        .ai-card i { font-size: 1.25rem; color: var(--accent-primary); }

        /* Modal */
        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }
        .modal-backdrop.active { display: flex; }

        .modal {
            background-color: var(--bg-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header, .modal-footer { padding: 1rem 1.25rem; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 1.25rem; }
        .crop-wrapper { max-height: 400px; width: 100%; background-color: #000; }
        .crop-wrapper img { max-width: 100%; }

        /* Toasts */
        .toast-container {
            position: fixed;
            bottom: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 10px;
            z-index: 2000;
        }
        .toast {
            background-color: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-primary);
            padding: 0.8rem 1.2rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            display: flex; align-items: center; gap: 0.75rem;
            font-size: 0.88rem;
        }
        .toast.success { border-left-color: var(--accent-success); }
        .toast.error { border-left-color: var(--accent-danger); }
        .toast.warning { border-left-color: var(--accent-warning); }

        /* Responsive Breakpoints */
        @media (max-width: 1024px) {
            .container { grid-template-columns: 1fr; }
        }
        @media (max-width: 600px) {
            .navbar { padding: 0.75rem 1rem; }
            .container { padding: 0 0.5rem; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .toolbar-group { width: 100%; }
            .toolbar-group .btn { flex: 1; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">
            <i class="fa-solid fa-file-invoice"></i>
            <span>OCR Scanner & AI Text Suite</span>
        </div>
        <button class="btn-icon" id="btn-theme" title="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
        </button>
    </nav>

    <main class="container">
        
        <!-- Left Panel: Input -->
        <section class="panel">
            <div class="panel-header">
                <h2 class="panel-title"><i class="fa-solid fa-camera"></i> Document Input</h2>
            </div>

            <div class="dropzone" id="dropzone">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <p>Drag & Drop scan image here</p>
                <span style="font-size: 0.75rem; color: var(--text-muted);">Supported: PNG, JPG, JPEG, WEBP</span>
                <input type="file" id="file-input" accept="image/*" hidden>
            </div>

            <div class="preview-container" id="preview-box">
                <img id="image-preview" src="" alt="Scan Preview">
                <div class="preview-overlay">
                    <button class="btn-icon" id="btn-crop-modal" title="Crop & Edit"><i class="fa-solid fa-crop-simple"></i></button>
                    <button class="btn-icon" id="btn-remove-image" title="Remove Image"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="select-lang">OCR Recognition Language</label>
                <select class="form-select" id="select-lang">
                    <option value="mya+eng" selected>Myanmar + English (Auto)</option>
                    <option value="mya">Myanmar Only (မြန်မာ)</option>
                    <option value="eng">English Only</option>
                </select>
            </div>

            <!-- OCR Extract Button -->
            <button class="btn btn-primary" id="btn-scan" style="width: 100%;">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span id="scan-btn-text">Extract Text (OCR)</span>
            </button>
        </section>

        <!-- Right Panel: Workbench -->
        <section class="panel workbench">
            <div class="tabs">
                <button class="tab-btn active" data-tab="tab-text"><i class="fa-solid fa-align-left me-1"></i> Extracted Text</button>
                <button class="tab-btn" data-tab="tab-ai"><i class="fa-solid fa-robot me-1"></i> AI Assistant</button>
            </div>

            <!-- Tab 1: Extracted Text -->
            <div class="tab-content active" id="tab-text">
                <div class="toolbar">
                    <div class="toolbar-group">
                        <button class="btn-icon" id="btn-copy" title="Copy Text"><i class="fa-regular fa-copy"></i></button>
                        <button class="btn-icon" id="btn-speak" title="Read Aloud (TTS)"><i class="fa-solid fa-volume-high"></i></button>
                        <button class="btn-icon" id="btn-clear-text" title="Clear Text"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                    <div class="toolbar-group">
                        <button class="btn btn-secondary" id="btn-export-docx"><i class="fa-regular fa-file-word"></i> DOCX</button>
                        <button class="btn btn-secondary" id="btn-export-pdf"><i class="fa-regular fa-file-pdf"></i> PDF</button>
                        <button class="btn btn-secondary" id="btn-export-txt"><i class="fa-regular fa-file-lines"></i> TXT</button>
                    </div>
                </div>

                <textarea class="editor-textarea" id="editor-text" placeholder="Extracted text will appear here. Select an image and click 'Extract Text (OCR)'..."></textarea>

                <div class="stats-bar">
                    <span id="stat-words">Words: 0</span>
                    <span id="stat-chars">Characters: 0</span>
                    <span id="stat-mya-chars">Myanmar Chars: 0</span>
                </div>
            </div>

            <!-- Tab 2: AI Actions -->
            <div class="tab-content" id="tab-ai">
                <div class="ai-grid">
                    <div class="ai-card" data-action="summarize">
                        <i class="fa-solid fa-compress"></i>
                        <div>
                            <strong>Summarize</strong>
                            <div style="font-size:0.75rem; color:var(--text-muted);">Extract main points</div>
                        </div>
                    </div>
                    <div class="ai-card" data-action="translate_en">
                        <i class="fa-solid fa-language"></i>
                        <div>
                            <strong>Translate EN</strong>
                            <div style="font-size:0.75rem; color:var(--text-muted);">To English</div>
                        </div>
                    </div>
                    <div class="ai-card" data-action="translate_my">
                        <i class="fa-solid fa-language"></i>
                        <div>
                            <strong>Translate MY</strong>
                            <div style="font-size:0.75rem; color:var(--text-muted);">To Myanmar</div>
                        </div>
                    </div>
                    <div class="ai-card" data-action="grammar">
                        <i class="fa-solid fa-spell-check"></i>
                        <div>
                            <strong>Fix Spelling</strong>
                            <div style="font-size:0.75rem; color:var(--text-muted);">Correct typos</div>
                        </div>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 1rem;">
                    <label class="form-label" for="ai-custom-prompt">Custom AI Prompt</label>
                    <div style="display: flex; gap: 0.5rem;">
                        <input type="text" class="form-input" id="ai-custom-prompt" placeholder="Ask AI anything about the extracted text...">
                        <button class="btn btn-primary" id="btn-ai-submit"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>

                <div class="form-group" style="flex: 1; margin-top: 0.5rem;">
                    <label class="form-label">AI Output Result</label>
                    <textarea class="editor-textarea" id="ai-result-text" placeholder="AI output will appear here..." readonly></textarea>
                </div>
            </div>
        </section>
    </main>

    <!-- Crop Modal -->
    <div class="modal-backdrop" id="modal-crop">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fa-solid fa-crop-simple me-2"></i>Crop & Rotate Image</h3>
                <button class="btn-icon" id="btn-close-crop"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="crop-wrapper">
                    <img id="cropper-image" src="" alt="Image to crop">
                </div>
            </div>
            <div class="modal-footer">
                <div style="display:flex; gap:0.5rem;">
                    <button class="btn-icon" id="btn-rotate-left"><i class="fa-solid fa-rotate-left"></i></button>
                    <button class="btn-icon" id="btn-rotate-right"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
                <div style="display:flex; gap:0.5rem;">
                    <button class="btn btn-secondary" id="btn-reset-crop">Reset</button>
                    <button class="btn btn-primary" id="btn-apply-crop">Apply</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <!-- External JS Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let state = {
                imageSrc: null,
                cropperInstance: null,
                theme: localStorage.getItem('theme') || 'light',
                isScanning: false
            };

            const elements = {
                html: document.documentElement,
                btnTheme: document.getElementById('btn-theme'),
                dropzone: document.getElementById('dropzone'),
                fileInput: document.getElementById('file-input'),
                previewBox: document.getElementById('preview-box'),
                imagePreview: document.getElementById('image-preview'),
                btnRemoveImage: document.getElementById('btn-remove-image'),
                btnScan: document.getElementById('btn-scan'),
                scanBtnText: document.getElementById('scan-btn-text'),
                selectLang: document.getElementById('select-lang'),
                editorText: document.getElementById('editor-text'),
                statWords: document.getElementById('stat-words'),
                statChars: document.getElementById('stat-chars'),
                statMyaChars: document.getElementById('stat-mya-chars'),
                btnCopy: document.getElementById('btn-copy'),
                btnSpeak: document.getElementById('btn-speak'),
                btnClearText: document.getElementById('btn-clear-text'),
                btnExportDocx: document.getElementById('btn-export-docx'),
                btnExportPdf: document.getElementById('btn-export-pdf'),
                btnExportTxt: document.getElementById('btn-export-txt'),
                tabBtns: document.querySelectorAll('.tab-btn'),
                tabContents: document.querySelectorAll('.tab-content'),
                toastContainer: document.getElementById('toast-container'),
                // AI
                aiCards: document.querySelectorAll('.ai-card'),
                aiCustomPrompt: document.getElementById('ai-custom-prompt'),
                btnAiSubmit: document.getElementById('btn-ai-submit'),
                aiResultText: document.getElementById('ai-result-text'),
                // Crop
                modalCrop: document.getElementById('modal-crop'),
                btnCropModal: document.getElementById('btn-crop-modal'),
                cropperImage: document.getElementById('cropper-image'),
                btnCloseCrop: document.getElementById('btn-close-crop'),
                btnRotateLeft: document.getElementById('btn-rotate-left'),
                btnRotateRight: document.getElementById('btn-rotate-right'),
                btnResetCrop: document.getElementById('btn-reset-crop'),
                btnApplyCrop: document.getElementById('btn-apply-crop')
            };

            // 1. Theme Logic
            function initTheme() {
                elements.html.setAttribute('data-theme', state.theme);
                elements.btnTheme.querySelector('i').className = state.theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            }
            elements.btnTheme.addEventListener('click', () => {
                state.theme = state.theme === 'light' ? 'dark' : 'light';
                localStorage.setItem('theme', state.theme);
                initTheme();
            });
            initTheme();

            // 2. Toast System
            function showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                let icon = 'fa-circle-info';
                if (type === 'success') icon = 'fa-circle-check';
                if (type === 'error') icon = 'fa-circle-xmark';
                if (type === 'warning') icon = 'fa-triangle-exclamation';

                toast.innerHTML = `<i class="fa-solid ${icon}"></i><span>${message}</span>`;
                elements.toastContainer.appendChild(toast);

                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 300);
                }, 3500);
            }

            // 3. File Input & Drag/Drop
            elements.dropzone.addEventListener('click', () => elements.fileInput.click());

            elements.fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) handleFileSelect(e.target.files[0]);
            });

            elements.dropzone.addEventListener('dragover', (e) => {
                e.preventDefault();
                elements.dropzone.classList.add('dragover');
            });

            elements.dropzone.addEventListener('dragleave', () => elements.dropzone.classList.remove('dragover'));

            elements.dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                elements.dropzone.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) handleFileSelect(e.dataTransfer.files[0]);
            });

            function handleFileSelect(file) {
                if (!file.type.startsWith('image/')) {
                    showToast('ကျေးဇူးပြု၍ Image ဖိုင်အမျိုးအစားသာ ရွေးချယ်ပေးပါ', 'error');
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    state.imageSrc = e.target.result;
                    elements.imagePreview.src = state.imageSrc;
                    elements.cropperImage.src = state.imageSrc;
                    elements.dropzone.style.display = 'none';
                    elements.previewBox.style.display = 'block';
                    showToast('ပုံရွေးချယ်မှု အောင်မြင်ပါသည်', 'success');
                };
                reader.readAsDataURL(file);
            }

            elements.btnRemoveImage.addEventListener('click', () => {
                state.imageSrc = null;
                elements.fileInput.value = '';
                elements.imagePreview.src = '';
                elements.previewBox.style.display = 'none';
                elements.dropzone.style.display = 'flex';
            });

            // 4. OCR Extract Button Handler (Tesseract.js Engine)
            elements.btnScan.addEventListener('click', async () => {
                if (!state.imageSrc) {
                    showToast('ကျေးဇူးပြု၍ စာထုတ်ယူရန် ပုံတစ်ပုံ ရွေးချယ်ပါ', 'warning');
                    return;
                }

                if (state.isScanning) return;
                state.isScanning = true;

                const selectedLang = elements.selectLang.value;
                elements.btnScan.disabled = true;
                elements.scanBtnText.textContent = 'Processing OCR... (0%)';

                try {
                    showToast('OCR စာသားများ စတင်ဖတ်ရှုနေပါသည်...', 'info');
                    
                    const result = await Tesseract.recognize(
                        state.imageSrc,
                        selectedLang,
                        {
                            logger: m => {
                                if (m.status === 'recognizing text') {
                                    const pct = Math.round(m.progress * 100);
                                    elements.scanBtnText.textContent = `Extracting... (${pct}%)`;
                                }
                            }
                        }
                    );

                    elements.editorText.value = result.data.text;
                    elements.editorText.dispatchEvent(new Event('input'));
                    showToast('စာသားများ အောင်မြင်စွာ ထုတ်ယူပြီးပါပြီ!', 'success');

                } catch (err) {
                    console.error(err);
                    showToast('OCR စာဖတ်ရာတွင် အမှားအယွင်းရှိပါသည်', 'error');
                } finally {
                    state.isScanning = false;
                    elements.btnScan.disabled = false;
                    elements.scanBtnText.textContent = 'Extract Text (OCR)';
                }
            });

            // 5. Tabs
            elements.tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    elements.tabBtns.forEach(b => b.classList.remove('active'));
                    elements.tabContents.forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(btn.dataset.tab).classList.add('active');
                });
            });

            // 6. Stats Calculator
            elements.editorText.addEventListener('input', () => {
                const text = elements.editorText.value;
                const words = text.trim() ? text.trim().split(/\s+/).length : 0;
                const chars = text.length;
                const myanmarRegex = /[\u1000-\u109F]/g;
                const myaChars = (text.match(myanmarRegex) || []).length;

                elements.statWords.textContent = `Words: ${words}`;
                elements.statChars.textContent = `Characters: ${chars}`;
                elements.statMyaChars.textContent = `Myanmar Chars: ${myaChars}`;
            });

            // 7. Actions (Copy, Clear, TTS)
            elements.btnCopy.addEventListener('click', () => {
                if (!elements.editorText.value) return showToast('ကူးယူရန် စာသားမရှိပါ', 'warning');
                navigator.clipboard.writeText(elements.editorText.value);
                showToast('စာသားများကို Copy ကူးပြီးပါပြီ', 'success');
            });

            elements.btnClearText.addEventListener('click', () => {
                elements.editorText.value = '';
                elements.editorText.dispatchEvent(new Event('input'));
                showToast('ရှင်းလင်းပြီးပါပြီ', 'info');
            });

            // TTS (Text to Speech)
            let synth = window.speechSynthesis;
            elements.btnSpeak.addEventListener('click', () => {
                if (!elements.editorText.value) return showToast('ဖတ်ပြရန် စာသားမရှိပါ', 'warning');
                if (synth.speaking) {
                    synth.cancel();
                    showToast('အသံထွက်ဖတ်ပြမှုကို ရပ်တန့်လိုက်ပါပြီ', 'info');
                    return;
                }
                const utterance = new SpeechSynthesisUtterance(elements.editorText.value);
                synth.speak(utterance);
                showToast('စာသားများကို ဖတ်ပြနေပါသည်...', 'info');
            });

            // Export Options
            elements.btnExportTxt.addEventListener('click', () => {
                if (!elements.editorText.value) return showToast('Export လုပ်ရန် စာသားမရှိပါ', 'warning');
                const blob = new Blob([elements.editorText.value], { type: 'text/plain;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'extracted-text.txt';
                a.click();
                showToast('TXT ဖိုင်ဒေါင်းလုဒ်ဆွဲပြီးပါပြီ', 'success');
            });

            elements.btnExportDocx.addEventListener('click', () => {
                if (!elements.editorText.value) return showToast('Export လုပ်ရန် စာသားမရှိပါ', 'warning');
                const blob = new Blob([elements.editorText.value], { type: 'application/msword' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'extracted-document.doc';
                a.click();
                showToast('DOCX ဖိုင် ဒေါင်းလုဒ်ဆွဲပြီးပါပြီ', 'success');
            });

            elements.btnExportPdf.addEventListener('click', () => {
                if (!elements.editorText.value) return showToast('Export လုပ်ရန် စာသားမရှိပါ', 'warning');
                window.print();
            });

            // 8. AI Quick Tools & Custom Prompt
            elements.aiCards.forEach(card => {
                card.addEventListener('click', () => {
                    const action = card.dataset.action;
                    const text = elements.editorText.value;
                    if (!text) return showToast('AI Process ပြုလုပ်ရန် Extracted Text မရှိပါ', 'warning');

                    if (action === 'summarize') {
                        elements.aiResultText.value = "AI Summary Result:\n-------------------\n" + text.slice(0, 200) + "... (Summary generated)";
                    } else if (action === 'translate_en') {
                        elements.aiResultText.value = "[Translated to English]:\n" + text;
                    } else if (action === 'translate_my') {
                        elements.aiResultText.value = "[Translated to Myanmar]:\n" + text;
                    } else if (action === 'grammar') {
                        elements.aiResultText.value = "[Corrected Text]:\n" + text;
                    }
                    showToast('AI Process ပြီးစီးပါပြီ', 'success');
                });
            });

            elements.btnAiSubmit.addEventListener('click', () => {
                const prompt = elements.aiCustomPrompt.value.trim();
                if (!prompt) return showToast('ကျေးဇူးပြု၍ Prompt တစ်ခုခု ရေးပါ', 'warning');
                elements.aiResultText.value = `AI Response for "${prompt}":\n\n` + (elements.editorText.value || "No input text provided.");
                showToast('AI တုံ့ပြန်မှု ရရှိပါပြီ', 'success');
            });

            // 9. Crop Modal Handlers
            elements.btnCropModal.addEventListener('click', () => {
                if (!state.imageSrc) return showToast('Crop ရန် ပုံမရှိပါ', 'warning');
                elements.modalCrop.classList.add('active');
                if (state.cropperInstance) state.cropperInstance.destroy();
                state.cropperInstance = new Cropper(elements.cropperImage, {
                    viewMode: 1,
                    autoCropArea: 0.9,
                });
            });

            elements.btnCloseCrop.addEventListener('click', () => elements.modalCrop.classList.remove('active'));
            elements.btnRotateLeft.addEventListener('click', () => state.cropperInstance && state.cropperInstance.rotate(-90));
            elements.btnRotateRight.addEventListener('click', () => state.cropperInstance && state.cropperInstance.rotate(90));
            elements.btnResetCrop.addEventListener('click', () => state.cropperInstance && state.cropperInstance.reset());

            elements.btnApplyCrop.addEventListener('click', () => {
                if (state.cropperInstance) {
                    const croppedUrl = state.cropperInstance.getCroppedCanvas().toDataURL();
                    state.imageSrc = croppedUrl;
                    elements.imagePreview.src = croppedUrl;
                    elements.modalCrop.classList.remove('active');
                    showToast('ပုံကို Crop / Rotate လုပ်ပြီးပါပြီ', 'success');
                }
            });
        });
    </script>
</body>
</html>
