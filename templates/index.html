<!DOCTYPE html>
<html lang="my" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus OCR Studio</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    
    <style>
        :root {
            --bg-grad-1: #090d16;
            --bg-grad-2: #111827;
            --surface: rgba(30, 41, 59, 0.8);
            --surface-hover: rgba(51, 65, 85, 0.9);
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(99, 102, 241, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --primary-solid: #6366f1;
            --primary-hover: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --danger: #f43f5e;
            --success: #10b981;
            --radius-card: 20px;
            --radius-element: 12px;
            --shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.6);
        }

        [data-theme="light"] {
            --bg-grad-1: #f8fafc;
            --bg-grad-2: #e2e8f0;
            --surface: rgba(255, 255, 255, 0.9);
            --surface-hover: rgba(241, 245, 249, 0.98);
            --border: rgba(0, 0, 0, 0.08);
            --border-focus: rgba(79, 70, 229, 0.4);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary-grad: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
            --primary-solid: #4f46e5;
            --primary-hover: #4338ca;
            --accent-glow: rgba(79, 70, 229, 0.15);
            --shadow: 0 10px 25px -10px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background 0.4s ease, color 0.4s ease;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.85rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 700;
            font-size: 1.2rem;
            background: var(--primary-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-icon {
            font-size: 1.4rem;
            background: var(--primary-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        button, .btn {
            background: var(--surface);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.6rem 1rem;
            border-radius: var(--radius-element);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        button:hover {
            background: var(--surface-hover);
            border-color: var(--border-focus);
        }

        .btn-primary {
            background: var(--primary-grad);
            color: white !important;
            border: none;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-primary:hover {
            background: var(--primary-grad) !important;
            opacity: 0.92;
            color: white !important;
            border-color: transparent;
        }

        .btn.active-tab {
            background: var(--primary-solid);
            color: white !important;
            border-color: var(--primary-solid);
        }

        /* Responsive Expanded Bento Grid Layout */
        main {
            flex: 1;
            padding: 1rem;
            max-width: 1650px;
            width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
        }

        @media(min-width: 1100px) {
            main {
                grid-template-columns: 1fr 1fr;
                padding: 1.75rem;
                gap: 1.5rem;
            }
        }

        .bento-card {
            background: var(--surface);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 1.25rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 1.15rem;
        }

        @media(min-width: 768px) {
            .bento-card {
                padding: 1.75rem;
            }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .card-title i {
            color: var(--primary-solid);
        }

        .dropzone {
            border: 2px dashed var(--border);
            border-radius: var(--radius-element);
            padding: 2.5rem 1rem;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            background: rgba(255, 255, 255, 0.01);
            transition: all 0.2s;
        }

        .dropzone i {
            font-size: 2.5rem;
            background: var(--primary-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .preview-box {
            position: relative;
            display: none;
            width: 100%;
            max-height: 350px;
            background: #000;
            border-radius: var(--radius-element);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .preview-box img {
            width: 100%;
            height: auto;
            max-height: 350px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .preview-actions {
            display: flex;
            gap: 0.5rem;
        }

        .controls-row {
            display: flex;
            gap: 0.6rem;
            flex-direction: column;
            width: 100%;
        }

        @media(min-width: 480px) {
            .controls-row {
                flex-direction: row;
                align-items: center;
            }
        }

        .scan-controls-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.6rem;
            width: 100%;
        }

        @media(min-width: 480px) {
            .scan-controls-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        select, input[type="text"] {
            background: var(--surface);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.7rem 0.95rem;
            border-radius: var(--radius-element);
            outline: none;
            width: 100%;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        select option {
            background: var(--bg-grad-2);
            color: var(--text-main);
        }

        select:focus, input[type="text"]:focus, textarea:focus {
            border-color: var(--primary-solid);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        textarea {
            width: 100%;
            height: 260px;
            background: var(--surface);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: var(--radius-element);
            padding: 1rem;
            resize: vertical;
            outline: none;
            font-size: 0.95rem;
            line-height: 1.6;
            transition: border-color 0.2s;
        }

        @media(min-width: 1100px) {
            textarea { height: 340px; }
        }

        .stats-bar {
            display: flex;
            gap: 1.25rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            flex-wrap: wrap;
        }

        .ai-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.6rem;
        }

        @media(min-width: 640px) {
            .ai-grid { grid-template-columns: repeat(4, 1fr); }
        }

        .ai-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-element);
            padding: 0.85rem 0.6rem;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
        }

        .ai-card:hover {
            border-color: var(--primary-solid);
            background: var(--surface-hover);
        }

        .ai-card i {
            font-size: 1.2rem;
            background: var(--primary-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ai-card span {
            font-size: 0.85rem;
            font-weight: 500;
        }

        .workspace-section {
            display: none;
            flex-direction: column;
            gap: 1.15rem;
        }

        .workspace-section.active {
            display: flex;
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
            padding: 1rem;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--bg-grad-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .modal-header {
            padding: 1.15rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 0;
            overflow-y: auto;
            flex: 1;
            background: #000;
        }

        .modal-footer {
            padding: 1.15rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 0.6rem;
        }

        .phone-editor-toolbar {
            display: flex;
            gap: 0.5rem;
            padding: 0.7rem 1rem;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            align-items: center;
        }

        #toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 2000;
        }

        .toast {
            background: var(--surface);
            backdrop-filter: blur(20px);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.85rem 1.15rem;
            border-radius: var(--radius-element);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 0.7rem;
            font-size: 0.9rem;
        }

        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Glass Header -->
    <header>
        <div class="logo-area">
            <i class="fa-solid fa-wand-magic-sparkles logo-icon"></i>
            <span>Nexus OCR Studio</span>
        </div>
        <div class="header-tools">
            <button id="btn-theme" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
        </div>
    </header>

    <!-- Responsive Bento Layout -->
    <main>
        <!-- Card 1: Source Image Input -->
        <div class="bento-card">
            <div class="card-header">
                <div class="card-title"><i class="fa-solid fa-image"></i> Source Image Input</div>
            </div>

            <div id="dropzone" class="dropzone">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <div>
                    <p style="font-weight: 600; font-size: 0.95rem; margin-bottom: 0.2rem;">Drop image here or browse</p>
                    <span style="font-size: 0.8rem; color: var(--text-muted);">Supports PNG, JPG, WEBP</span>
                </div>
                <input type="file" id="file-input" accept="image/*" style="display: none;">
            </div>

            <div id="preview-box" class="preview-box">
                <img id="image-preview" src="" alt="Preview">
            </div>

            <div class="preview-actions" id="preview-actions" style="display: none;">
                <button id="btn-crop-modal" class="btn"><i class="fa-solid fa-crop-simple"></i> Edit / Crop</button>
                <button id="btn-remove-image" class="btn" style="color: var(--danger);"><i class="fa-solid fa-trash"></i> Remove</button>
            </div>

            <div class="scan-controls-grid" style="margin-top: auto;">
                <select id="select-lang">
                    <option value="eng">English</option>
                    <option value="mya">Myanmar</option>
                    <option value="mya+eng">Myanmar + English</option>
                </select>
                <button id="btn-scan" class="btn btn-primary" style="width: 100%;">
                    <i class="fa-solid fa-bolt"></i>
                    <span id="scan-btn-text">Extract Text (OCR)</span>
                </button>
            </div>
        </div>

        <!-- Card 2: Text Workspace & AI -->
        <div class="bento-card">
            <div class="card-header">
                <div class="card-title"><i class="fa-solid fa-pen-nib"></i> Text Workspace & AI</div>
            </div>

            <!-- Tab Switcher Buttons -->
            <div class="controls-row" style="background: rgba(0,0,0,0.15); padding: 5px; border-radius: var(--radius-element); flex-direction: row;">
                <button id="tab-ocr" class="btn active-tab" style="flex: 1;"><i class="fa-solid fa-file-lines"></i> OCR Result</button>
                <button id="tab-ai" class="btn" style="flex: 1;"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Workspace</button>
            </div>

            <!-- Section 1: OCR Result View -->
            <div id="section-ocr" class="workspace-section active">
                <textarea id="ocr-text" placeholder="Extracted OCR text will appear here..."></textarea>
                
                <div class="stats-bar">
                    <span id="stat-words">Words: 0</span>
                    <span id="stat-chars">Chars: 0</span>
                    <span id="stat-mya-chars">Mya Chars: 0</span>
                </div>

                <div class="controls-row" style="justify-content: space-between; flex-direction: row; flex-wrap: wrap;">
                    <div style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
                        <button id="btn-copy-ocr" class="btn"><i class="fa-solid fa-copy"></i> Copy</button>
                        <button id="btn-speak-ocr" class="btn"><i id="speaker-icon-ocr" class="fa-solid fa-volume-high"></i></button>
                        <button id="btn-clear-ocr" class="btn" style="color: var(--danger);"><i class="fa-solid fa-eraser"></i></button>
                    </div>
                    <div style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
                        <button id="btn-export-ocr-txt" class="btn">.TXT</button>
                        <button id="btn-export-ocr-docx" class="btn">.DOCX</button>
                        <button id="btn-export-ocr-pdf" class="btn">.PDF</button>
                    </div>
                </div>
            </div>

            <!-- Section 2: AI Workspace View -->
            <div id="section-ai" class="workspace-section">
                <div class="ai-grid">
                    <div class="ai-card" data-action="summarize"><i class="fa-solid fa-compress"></i><span>Summarize</span></div>
                    <div class="ai-card" data-action="translate_en"><i class="fa-solid fa-language"></i><span>To English</span></div>
                    <div class="ai-card" data-action="translate_my"><i class="fa-solid fa-globe"></i><span>To Myanmar</span></div>
                    <div class="ai-card" data-action="grammar"><i class="fa-solid fa-spell-check"></i><span>Grammar Fix</span></div>
                </div>

                <div class="controls-row" style="flex-direction: row;">
                    <input type="text" id="ai-custom-prompt" placeholder="Ask AI anything about this text..." style="flex: 1;">
                    <button id="btn-ai-submit" class="btn btn-primary" style="padding: 0.7rem 1.2rem;"><i class="fa-solid fa-paper-plane"></i></button>
                </div>

                <textarea id="ai-text" placeholder="AI processed or translated output will appear here..."></textarea>

                <div class="controls-row" style="justify-content: space-between; flex-direction: row; flex-wrap: wrap;">
                    <div style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
                        <button id="btn-copy-ai" class="btn"><i class="fa-solid fa-copy"></i> Copy</button>
                        <button id="btn-speak-ai" class="btn"><i id="speaker-icon-ai" class="fa-solid fa-volume-high"></i></button>
                        <button id="btn-clear-ai" class="btn" style="color: var(--danger);"><i class="fa-solid fa-eraser"></i></button>
                    </div>
                    <div style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
                        <button id="btn-export-ai-txt" class="btn">.TXT</button>
                        <button id="btn-export-ai-docx" class="btn">.DOCX</button>
                        <button id="btn-export-ai-pdf" class="btn">.PDF</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Phone-Style Photo Editor Modal -->
    <div id="modal-crop" class="modal">
        <div class="modal-content" style="max-width: 850px;">
            <div class="modal-header">
                <h3><i class="fa-solid fa-sliders"></i> Phone Photo Editor</h3>
                <button id="btn-close-crop" class="btn" style="border:none;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="phone-editor-toolbar">
                <button class="btn aspect-btn active-preset" data-ratio="NaN">Free</button>
                <button class="btn aspect-btn" data-ratio="1">1:1</button>
                <button class="btn aspect-btn" data-ratio="1.33333">4:3</button>
                <button class="btn aspect-btn" data-ratio="1.77777">16:9</button>
                <div style="width: 1px; height: 20px; background: var(--border); margin: 0 0.3rem;"></div>
                <button id="btn-rotate-left" class="btn"><i class="fa-solid fa-rotate-left"></i></button>
                <button id="btn-rotate-right" class="btn"><i class="fa-solid fa-rotate-right"></i></button>
                <button id="btn-flip-h" class="btn"><i class="fa-solid fa-arrows-left-right"></i></button>
                <button id="btn-flip-v" class="btn"><i class="fa-solid fa-arrows-up-down"></i></button>
                <button id="btn-reset-crop" class="btn"><i class="fa-solid fa-rotate"></i></button>
            </div>

            <div class="modal-body">
                <img id="cropper-image" src="" style="max-width: 100%; display: block;">
            </div>
            <div class="modal-footer">
                <button id="btn-cancel-crop" class="btn">Cancel</button>
                <button id="btn-apply-crop" class="btn btn-primary"><i class="fa-solid fa-check"></i> Apply</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Cropper.js Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <!-- App Logic Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const state = {
            theme: localStorage.getItem('nexus_theme') || 'dark',
            imageBlob: null,
            imageURL: null,
            cropper: null,
            scaleXVal: 1,
            scaleYVal: 1
        };

        const el = {
            html: document.documentElement,
            btnTheme: document.getElementById('btn-theme'),
            dropzone: document.getElementById('dropzone'),
            fileInput: document.getElementById('file-input'),
            previewBox: document.getElementById('preview-box'),
            imagePreview: document.getElementById('image-preview'),
            previewActions: document.getElementById('preview-actions'),
            btnRemoveImage: document.getElementById('btn-remove-image'),
            btnScan: document.getElementById('btn-scan'),
            scanBtnText: document.getElementById('scan-btn-text'),
            selectLang: document.getElementById('select-lang'),
            
            // Tabs
            tabOcr: document.getElementById('tab-ocr'),
            tabAi: document.getElementById('tab-ai'),
            sectionOcr: document.getElementById('section-ocr'),
            sectionAi: document.getElementById('section-ai'),
            
            ocrText: document.getElementById('ocr-text'),
            aiText: document.getElementById('ai-text'),
            statWords: document.getElementById('stat-words'),
            statChars: document.getElementById('stat-chars'),
            statMyaChars: document.getElementById('stat-mya-chars'),
            
            btnCopyOcr: document.getElementById('btn-copy-ocr'),
            btnSpeakOcr: document.getElementById('btn-speak-ocr'),
            speakerIconOcr: document.getElementById('speaker-icon-ocr'),
            btnClearOcr: document.getElementById('btn-clear-ocr'),
            btnExportOcrTxt: document.getElementById('btn-export-ocr-txt'),
            btnExportOcrDocx: document.getElementById('btn-export-ocr-docx'),
            btnExportOcrPdf: document.getElementById('btn-export-ocr-pdf'),
            
            aiCards: document.querySelectorAll('.ai-card'),
            aiCustomPrompt: document.getElementById('ai-custom-prompt'),
            btnAiSubmit: document.getElementById('btn-ai-submit'),
            
            btnCopyAi: document.getElementById('btn-copy-ai'),
            btnSpeakAi: document.getElementById('btn-speak-ai'),
            speakerIconAi: document.getElementById('speaker-icon-ai'),
            btnClearAi: document.getElementById('btn-clear-ai'),
            btnExportAiTxt: document.getElementById('btn-export-ai-txt'),
            btnExportAiDocx: document.getElementById('btn-export-ai-docx'),
            btnExportAiPdf: document.getElementById('btn-export-ai-pdf'),
            
            modalCrop: document.getElementById('modal-crop'),
            btnCropModal: document.getElementById('btn-crop-modal'),
            cropperImage: document.getElementById('cropper-image'),
            btnCloseCrop: document.getElementById('btn-close-crop'),
            btnCancelCrop: document.getElementById('btn-cancel-crop'),
            aspectBtns: document.querySelectorAll('.aspect-btn'),
            btnRotateLeft: document.getElementById('btn-rotate-left'),
            btnRotateRight: document.getElementById('btn-rotate-right'),
            btnFlipH: document.getElementById('btn-flip-h'),
            btnFlipV: document.getElementById('btn-flip-v'),
            btnResetCrop: document.getElementById('btn-reset-crop'),
            btnApplyCrop: document.getElementById('btn-apply-crop'),
            
            toastContainer: document.getElementById('toast-container')
        };

        el.html.setAttribute('data-theme', state.theme);
        updateThemeIcon();

        el.btnTheme.addEventListener('click', () => {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('nexus_theme', state.theme);
            el.html.setAttribute('data-theme', state.theme);
            updateThemeIcon();
        });

        function updateThemeIcon() {
            el.btnTheme.innerHTML = state.theme === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        }

        // Tab Switcher Logic
        el.tabOcr.addEventListener('click', () => {
            el.tabOcr.classList.add('active-tab');
            el.tabAi.classList.remove('active-tab');
            el.sectionOcr.classList.add('active');
            el.sectionAi.classList.remove('active');
        });

        el.tabAi.addEventListener('click', () => {
            el.tabAi.classList.add('active-tab');
            el.tabOcr.classList.remove('active-tab');
            el.sectionAi.classList.add('active');
            el.sectionOcr.classList.remove('active');
        });

        function showToast(msg, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i><span>${msg}</span>`;
            el.toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        el.dropzone.addEventListener('click', () => el.fileInput.click());
        el.dropzone.addEventListener('dragover', (e) => { e.preventDefault(); el.dropzone.classList.add('dragover'); });
        el.dropzone.addEventListener('dragleave', () => el.dropzone.classList.remove('dragover'));
        el.dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            el.dropzone.classList.remove('dragover');
            if (e.dataTransfer.files?.[0]) handleFile(e.dataTransfer.files[0]);
        });
        el.fileInput.addEventListener('change', (e) => {
            if (e.target.files?.[0]) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) return showToast('Please select a valid image file', 'error');
            state.imageBlob = file;
            if (state.imageURL) URL.revokeObjectURL(state.imageURL);
            state.imageURL = URL.createObjectURL(file);

            el.imagePreview.src = state.imageURL;
            el.dropzone.style.display = 'none';
            el.previewBox.style.display = 'block';
            el.previewActions.style.display = 'flex';
            showToast('Image uploaded successfully');
        }

        el.btnRemoveImage.addEventListener('click', () => {
            state.imageBlob = null;
            if (state.imageURL) URL.revokeObjectURL(state.imageURL);
            el.imagePreview.src = '';
            el.previewBox.style.display = 'none';
            el.previewActions.style.display = 'none';
            el.dropzone.style.display = 'flex';
            el.fileInput.value = '';
            el.ocrText.value = '';
            el.aiText.value = '';
            updateStats();
            if (el.aiCustomPrompt) el.aiCustomPrompt.value = '';
            showToast('Image and workspaces cleared', 'error');
        });

        el.btnCropModal.addEventListener('click', () => {
            if (!state.imageURL) return;
            el.cropperImage.src = state.imageURL;
            el.modalCrop.classList.add('active');
            if (state.cropper) state.cropper.destroy();
            state.scaleXVal = 1;
            state.scaleYVal = 1;
            state.cropper = new Cropper(el.cropperImage, { viewMode: 1, autoCropArea: 0.9 });
        });

        function closeCrop() {
            el.modalCrop.classList.remove('active');
            if (state.cropper) { state.cropper.destroy(); state.cropper = null; }
        }
        el.btnCloseCrop.addEventListener('click', closeCrop);
        el.btnCancelCrop.addEventListener('click', closeCrop);

        el.aspectBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                el.aspectBtns.forEach(b => b.classList.remove('active-preset'));
                btn.classList.add('active-preset');
                state.cropper?.setAspectRatio(parseFloat(btn.getAttribute('data-ratio')));
            });
        });

        el.btnRotateLeft.addEventListener('click', () => state.cropper?.rotate(-90));
        el.btnRotateRight.addEventListener('click', () => state.cropper?.rotate(90));
        el.btnFlipH.addEventListener('click', () => { state.scaleXVal *= -1; state.cropper?.scaleX(state.scaleXVal); });
        el.btnFlipV.addEventListener('click', () => { state.scaleYVal *= -1; state.cropper?.scaleY(state.scaleYVal); });
        el.btnResetCrop.addEventListener('click', () => { state.scaleXVal = 1; state.scaleYVal = 1; state.cropper?.reset(); });

        el.btnApplyCrop.addEventListener('click', () => {
            if (!state.cropper) return;
            state.cropper.getCroppedCanvas().toBlob((blob) => {
                state.imageBlob = blob;
                if (state.imageURL) URL.revokeObjectURL(state.imageURL);
                state.imageURL = URL.createObjectURL(blob);
                el.imagePreview.src = state.imageURL;
                closeCrop();
                showToast('Photo edits applied');
            }, 'image/jpeg', 0.95);
        });

        // Image Compression for Faster OCR
        function compressImage(file, maxWidth = 1200) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = URL.createObjectURL(file);
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    canvas.toBlob((blob) => {
                        URL.revokeObjectURL(img.src);
                        resolve(blob || file);
                    }, 'image/jpeg', 0.85);
                };
                img.onerror = () => resolve(file);
            });
        }

        // OCR Extract Logic
        el.btnScan.addEventListener('click', async () => {
            if (!state.imageBlob) return showToast('Please upload an image first', 'error');

            const selectedLang = el.selectLang.value;
            
            el.ocrText.value = 'Loading...';
            updateStats();

            setLoading(el.btnScan, el.scanBtnText, true, 'Extracting OCR...');

            try {
                const optimizedBlob = await compressImage(state.imageBlob);

                const formData = new FormData();
                formData.append('file', optimizedBlob);
                formData.append('lang', selectedLang);

                const res = await fetch('/ocr', { method: 'POST', body: formData });
                const data = await res.json();
                
                if (res.ok && data.text !== undefined) {
                    const text = data.text.trim();
                    const hasMyanmar = /[\u1000-\u109F]/.test(text);
                    const hasEnglish = /[a-zA-Z]/.test(text);

                    if (selectedLang === 'eng' && hasMyanmar && !hasEnglish) {
                        showToast('English သာရွေးထားပါသည်၊ ပုံထဲတွင် မြန်မာစာ ပါဝင်နေပါသည်', 'error');
                        el.ocrText.value = '';
                        updateStats();
                        return;
                    }
                    if (selectedLang === 'mya' && !hasMyanmar && hasEnglish) {
                        showToast('Myanmar သာရွေးထားပါသည်၊ ပုံထဲတွင် မြန်မာစာ မတွေ့ရှိပါ', 'error');
                        el.ocrText.value = '';
                        updateStats();
                        return;
                    }

                    el.ocrText.value = text;
                    updateStats();
                    showToast('Text extracted successfully!');
                } else {
                    el.ocrText.value = '';
                    updateStats();
                    showToast(data.error || 'OCR failed', 'error');
                }
            } catch {
                el.ocrText.value = '';
                updateStats();
                showToast('Server connection error', 'error');
            } finally {
                setLoading(el.btnScan, el.scanBtnText, false, 'Extract Text (OCR)');
            }
        });

        el.ocrText.addEventListener('input', updateStats);
        function updateStats() {
            const text = el.ocrText.value;
            if (text === 'Loading...') {
                el.statWords.textContent = 'Words: 0';
                el.statChars.textContent = 'Chars: 0';
                el.statMyaChars.textContent = 'Mya Chars: 0';
                return;
            }
            el.statWords.textContent = `Words: ${text.trim() ? text.trim().split(/\s+/).length : 0}`;
            el.statChars.textContent = `Chars: ${text.length}`;
            el.statMyaChars.textContent = `Mya Chars: ${(text.match(/[\u1000-\u109F]/g) || []).length}`;
        }

        el.btnCopyOcr.addEventListener('click', () => {
            if (!el.ocrText.value || el.ocrText.value === 'Loading...') return;
            navigator.clipboard.writeText(el.ocrText.value);
            showToast('OCR Text copied to clipboard!');
        });

        el.btnClearOcr.addEventListener('click', () => {
            el.ocrText.value = '';
            updateStats();
            showToast('OCR workspace cleared', 'error');
        });

        el.btnExportOcrTxt.addEventListener('click', () => downloadTxt(el.ocrText.value, 'OCR_Text'));
        el.btnExportOcrDocx.addEventListener('click', () => exportFile('/export/docx', el.ocrText.value, 'docx'));
        el.btnExportOcrPdf.addEventListener('click', () => exportFile('/export/pdf', el.ocrText.value, 'pdf'));

        el.btnCopyAi.addEventListener('click', () => {
            if (!el.aiText.value || el.aiText.value === 'Loading...') return;
            navigator.clipboard.writeText(el.aiText.value);
            showToast('AI Text copied to clipboard!');
        });

        el.btnClearAi.addEventListener('click', () => {
            el.aiText.value = '';
            showToast('AI workspace cleared', 'error');
        });

        el.btnExportAiTxt.addEventListener('click', () => downloadTxt(el.aiText.value, 'AI_Output'));
        el.btnExportAiDocx.addEventListener('click', () => exportFile('/export/docx', el.aiText.value, 'docx'));
        el.btnExportAiPdf.addEventListener('click', () => exportFile('/export/pdf', el.aiText.value, 'pdf'));

        // --- Mobile Compatible File Download Logic ---
        function downloadTxt(text, filenamePrefix) {
            if (!text || text === 'Loading...') return showToast('No text to export', 'error');
            try {
                const filename = `${filenamePrefix}_${Date.now()}.txt`;
                const dataUri = 'data:text/plain;charset=utf-8,' + encodeURIComponent(text);
                const a = document.createElement('a');
                a.href = dataUri;
                a.download = filename;
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => document.body.removeChild(a), 100);
                showToast('TXT downloaded successfully');
            } catch {
                showToast('Failed to export TXT', 'error');
            }
        }

        async function exportFile(endpoint, text, ext) {
            if (!text || text === 'Loading...') return showToast('No text to export', 'error');
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                if (!res.ok) throw new Error();
                const blob = await res.blob();
                const filename = `Export_${Date.now()}.${ext}`;

                // Convert blob to Data URL for maximum mobile browser compatibility
                const reader = new FileReader();
                reader.onloadend = function() {
                    const base64data = reader.result;
                    const a = document.createElement('a');
                    a.href = base64data;
                    a.download = filename;
                    a.target = '_blank';
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => document.body.removeChild(a), 100);
                    showToast(`Exported as ${ext.toUpperCase()}`);
                };
                reader.readAsDataURL(blob);
            } catch {
                showToast(`Failed to export ${ext.toUpperCase()}`, 'error');
            }
        }

        // --- Mobile Friendly Speech Synthesis Logic ---
        window.activeUtterance = null;

        if ('speechSynthesis' in window && window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
            try { window.speechSynthesis.getVoices(); } catch(e){}
        }

        el.btnSpeakOcr.addEventListener('click', () => speakText(el.ocrText.value, el.speakerIconOcr));
        el.btnSpeakAi.addEventListener('click', () => speakText(el.aiText.value, el.speakerIconAi));

        function speakText(text, iconEl) {
            const synth = window.speechSynthesis;
            if (!('speechSynthesis' in window) || !synth) {
                return showToast('TTS is restricted in this app browser. Open in Chrome/Safari.', 'error');
            }
            
            if (synth.speaking || synth.pending) {
                synth.cancel();
                iconEl.className = 'fa-solid fa-volume-high';
                return;
            }

            if (!text || text === 'Loading...') return showToast('No text available to speak', 'error');

            synth.cancel(); // Reset previous voice instances

            const isMyanmar = /[\u1000-\u109F]/.test(text);
            const utterance = new SpeechSynthesisUtterance(text);
            window.activeUtterance = utterance;

            const voices = synth.getVoices() || [];
            if (isMyanmar) {
                const myVoice = voices.find(v => v.lang && (v.lang.startsWith('my') || v.lang.includes('MM')));
                if (myVoice) {
                    utterance.voice = myVoice;
                    utterance.lang = myVoice.lang;
                } else {
                    utterance.lang = 'en-US';
                }
            } else {
                utterance.lang = 'en-US';
            }

            utterance.onstart = () => { iconEl.className = 'fa-solid fa-stop'; };
            utterance.onend = () => { 
                iconEl.className = 'fa-solid fa-volume-high'; 
                window.activeUtterance = null;
            };
            utterance.onerror = (e) => { 
                if (e.error !== 'interrupted') {
                    iconEl.className = 'fa-solid fa-volume-high'; 
                    window.activeUtterance = null;
                }
            };

            synth.speak(utterance);

            if (synth.paused) {
                synth.resume();
            }
        }

        el.aiCards.forEach(card => {
            card.addEventListener('click', () => triggerAI(card.getAttribute('data-action')));
        });

        el.btnAiSubmit.addEventListener('click', () => {
            const prompt = el.aiCustomPrompt.value.trim();
            if (!prompt) return showToast('Please enter a prompt', 'error');
            triggerAI('ask', prompt);
        });

        async function triggerAI(action, customPrompt = '') {
            const text = el.ocrText.value.trim();
            if (!text || text === 'Loading...') return showToast('Please extract OCR text first', 'error');

            el.aiText.value = 'Loading...';

            let payloadAction = action, targetLang = '', prompt = customPrompt;
            if (action === 'translate_en') { payloadAction = 'translate'; targetLang = 'en'; }
            else if (action === 'translate_my') { payloadAction = 'translate'; targetLang = 'my'; }
            else if (action === 'grammar') { payloadAction = 'explain'; prompt = 'Fix spelling and grammar mistakes.'; }

            try {
                const res = await fetch('/ai/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: payloadAction, text, target_lang: targetLang, prompt })
                });
                const data = await res.json();
                if (res.ok && data.result) {
                    el.aiText.value = data.result;
                    showToast('AI response generated!');
                } else {
                    el.aiText.value = '';
                    showToast(data.error || 'AI failed', 'error');
                }
            } catch {
                el.aiText.value = '';
                showToast('AI connection error', 'error');
            }
        }

        function setLoading(btn, labelSpan, loading, text) {
            btn.disabled = loading;
            labelSpan.textContent = text;
            if (loading) {
                const spinner = document.createElement('div');
                spinner.className = 'spinner';
                btn.prepend(spinner);
            } else {
                btn.querySelector('.spinner')?.remove();
            }
        }
    });
</script>
</body>
</html>
