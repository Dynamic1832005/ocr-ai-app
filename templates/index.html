<!DOCTYPE html>
<html lang="my" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myanmar OCR & AI Text Suite</title>
    
    <!-- Google Fonts (Padauk for Myanmar Script & Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6.4.0 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    
    <style>
        /* ==========================================================================
           CSS Custom Properties & Design System
           ========================================================================== */
        :root {
            --bg-primary: #f8fafc;
            --bg-surface: #ffffff;
            --bg-secondary: #f1f5f9;
            --border-color: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent-primary: #2563eb;
            --accent-primary-hover: #1d4ed8;
            --accent-danger: #ef4444;
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --font-main: 'Plus Jakarta Sans', 'Padauk', sans-serif;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-surface: #1e293b;
            --bg-secondary: #334155;
            --border-color: #475569;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --accent-primary: #3b82f6;
            --accent-primary-hover: #60a5fa;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.3);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4);
        }

        /* Base Reset */
        * {
            box-sizing: border-color;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
            transition: var(--transition);
        }

        /* Responsive Navbar Layout */
        .navbar {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            padding: 0.85rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-primary);
        }

        .brand i {
            font-size: 1.35rem;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Buttons & Icon Buttons */
        .btn-icon {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 38px;
            height: 38px;
            border-radius: var(--radius-md);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-icon:hover {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
        }

        .btn {
            padding: 0.55rem 1rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            border: none;
            transition: var(--transition);
            font-family: var(--font-main);
            white-space: nowrap;
        }

        .btn-primary {
            background-color: var(--accent-primary);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--accent-primary-hover);
        }

        .btn-secondary {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
        }

        .btn-danger {
            background-color: var(--accent-danger);
            color: #ffffff;
        }

        /* Responsive Main Container Layout */
        .container {
            max-width: 1400px;
            margin: 1.25rem auto;
            padding: 0 1rem;
            width: 100%;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 1.25rem;
            flex: 1;
        }

        /* Panels Structure */
        .panel {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.65rem;
        }

        .panel-title {
            font-size: 1.05rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-primary);
        }

        /* Dropzone Upload */
        .dropzone {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.75rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background-color: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--accent-primary);
            background-color: rgba(37, 99, 235, 0.05);
        }

        .dropzone i {
            font-size: 2.2rem;
            color: var(--accent-primary);
        }

        .dropzone p {
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .dropzone span {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Image Preview Box */
        .preview-container {
            position: relative;
            width: 100%;
            max-height: 230px;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: none;
            background-color: #000;
        }

        .preview-container img {
            width: 100%;
            height: 230px;
            object-fit: contain;
        }

        .preview-overlay {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 6px;
        }

        /* Form Controls */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .form-select, .form-input {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background-color: var(--bg-surface);
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 0.88rem;
            outline: none;
            transition: var(--transition);
        }

        .form-select:focus, .form-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* Workbench Editor */
        .workbench {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            flex: 1;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            overflow-x: auto;
        }

        .tab-btn {
            padding: 0.45rem 0.9rem;
            border-radius: var(--radius-sm);
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-main);
            white-space: nowrap;
        }

        .tab-btn.active {
            background-color: var(--accent-primary);
            color: #ffffff;
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 0.85rem;
            flex: 1;
        }

        .tab-content.active {
            display: flex;
        }

        .editor-textarea {
            width: 100%;
            min-height: 300px;
            flex: 1;
            padding: 0.9rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background-color: var(--bg-surface);
            color: var(--text-primary);
            font-family: 'Padauk', var(--font-main);
            font-size: 1rem;
            line-height: 1.8;
            resize: vertical;
            outline: none;
            transition: var(--transition);
        }

        .editor-textarea:focus {
            border-color: var(--accent-primary);
        }

        /* Responsive Editor Toolbar */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.6rem;
            background-color: var(--bg-secondary);
            padding: 0.6rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 0.78rem;
            color: var(--text-muted);
            padding: 0.2rem 0.4rem;
        }

        /* Responsive AI Action Grid */
        .ai-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.75rem;
        }

        .ai-card {
            border: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            padding: 0.75rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .ai-card:hover {
            border-color: var(--accent-primary);
            background-color: var(--bg-surface);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .ai-card i {
            font-size: 1.1rem;
            color: var(--accent-primary);
        }

        .ai-card-title {
            font-size: 0.82rem;
            font-weight: 600;
        }

        /* Responsive Modals */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-backdrop.active {
            display: flex;
        }

        .modal {
            background-color: var(--bg-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            padding: 0.85rem 1.1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 1rem;
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            padding: 0.85rem 1.1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            background-color: var(--bg-secondary);
            flex-wrap: wrap;
        }

        .crop-wrapper {
            max-height: 400px;
            width: 100%;
            background-color: #000;
        }

        .crop-wrapper img {
            max-width: 100%;
        }

        /* History List */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .history-item {
            padding: 0.75rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .history-item:hover {
            border-color: var(--accent-primary);
            background-color: var(--bg-surface);
        }

        .history-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .history-title {
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-date {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 15px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 2000;
            max-width: 90vw;
        }

        .toast {
            background-color: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-primary);
            padding: 0.7rem 1rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.82rem;
            transition: opacity 0.3s ease;
        }

        .toast.success { border-left-color: var(--accent-success); }
        .toast.error { border-left-color: var(--accent-danger); }
        .toast.warning { border-left-color: var(--accent-warning); }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ==========================================================================
           Media Queries for Mobile & Tablet Responsiveness
           ========================================================================== */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                margin: 0.85rem auto;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .toolbar-group {
                justify-content: space-between;
                width: 100%;
            }

            .toolbar-group .btn-secondary {
                flex: 1;
            }
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 0.75rem 0.85rem;
            }

            .brand span {
                font-size: 1rem;
            }

            .panel {
                padding: 0.9rem;
            }

            .ai-grid {
                grid-template-columns: 1fr;
            }

            .stats-bar {
                font-size: 0.72rem;
                gap: 0.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- Responsive Navigation Header -->
    <nav class="navbar">
        <div class="brand">
            <i class="fa-solid fa-file-invoice"></i>
            <span>Myanmar OCR Suite</span>
        </div>
        <div class="nav-controls">
            <button class="btn-icon" id="btn-history" title="Scan History">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </button>
            <button class="btn-icon" id="btn-theme" title="Toggle Theme">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </nav>

    <!-- Main Responsive Layout -->
    <main class="container">
        
        <!-- Left Panel: Upload & Control -->
        <section class="panel">
            <div class="panel-header">
                <h2 class="panel-title">
                    <i class="fa-solid fa-camera"></i>
                    Document Input
                </h2>
            </div>

            <div class="dropzone" id="dropzone">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <p>Drag & Drop image here</p>
                <span>Supported: PNG, JPG, JPEG, WEBP</span>
                <input type="file" id="file-input" accept="image/*" hidden>
            </div>

            <div class="preview-container" id="preview-box">
                <img id="image-preview" src="" alt="Preview">
                <div class="preview-overlay">
                    <button class="btn-icon" id="btn-crop-modal" title="Crop & Edit">
                        <i class="fa-solid fa-crop-simple"></i>
                    </button>
                    <button class="btn-icon" id="btn-remove-image" title="Remove Image">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="select-lang">OCR Language</label>
                <select class="form-select" id="select-lang">
                    <option value="mya+eng" selected>Myanmar + English (Auto)</option>
                    <option value="mya">Myanmar Only (မြန်မာ)</option>
                    <option value="eng">English Only</option>
                </select>
            </div>

            <button class="btn btn-primary" id="btn-scan" style="width: 100%;">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span id="scan-btn-text">Extract Text (OCR)</span>
            </button>
        </section>

        <!-- Right Panel: Responsive Workbench -->
        <section class="panel workbench">
            
            <div class="tabs">
                <button class="tab-btn active" data-tab="tab-text">
                    <i class="fa-solid fa-align-left me-1"></i> Extracted Text
                </button>
                <button class="tab-btn" data-tab="tab-ai">
                    <i class="fa-solid fa-robot me-1"></i> AI Assistant
                </button>
            </div>

            <!-- Tab 1: Text Editor -->
            <div class="tab-content active" id="tab-text">
                <div class="toolbar">
                    <div class="toolbar-group">
                        <button class="btn-icon" id="btn-copy" title="Copy Text"><i class="fa-regular fa-copy"></i></button>
                        <button class="btn-icon" id="btn-speak" title="Read Aloud"><i class="fa-solid fa-volume-high"></i></button>
                        <button class="btn-icon" id="btn-clear-text" title="Clear Text"><i class="fa-solid fa-trash-can"></i></button>
                    </div>

                    <div class="toolbar-group">
                        <button class="btn btn-secondary" id="btn-export-docx"><i class="fa-regular fa-file-word"></i> DOCX</button>
                        <button class="btn btn-secondary" id="btn-export-pdf"><i class="fa-regular fa-file-pdf"></i> PDF</button>
                        <button class="btn btn-secondary" id="btn-export-txt"><i class="fa-regular fa-file-lines"></i> TXT</button>
                    </div>
                </div>

                <textarea class="editor-textarea" id="editor-text" placeholder="Extracted text will appear here..."></textarea>

                <div class="stats-bar">
                    <span id="stat-words">Words: 0</span>
                    <span id="stat-chars">Characters: 0</span>
                    <span id="stat-mya-chars">Myanmar Chars: 0</span>
                </div>
            </div>

            <!-- Tab 2: AI Actions -->
            <div class="tab-content" id="tab-ai">
                <div class="ai-grid">
                    <div class="ai-card" data-action="summarize">
                        <i class="fa-solid fa-compress"></i>
                        <div>
                            <div class="ai-card-title">Summarize</div>
                            <small class="text-muted">Extract main points</small>
                        </div>
                    </div>

                    <div class="ai-card" data-action="translate_en">
                        <i class="fa-solid fa-language"></i>
                        <div>
                            <div class="ai-card-title">Translate to EN</div>
                            <small class="text-muted">Myanmar to English</small>
                        </div>
                    </div>

                    <div class="ai-card" data-action="translate_my">
                        <i class="fa-solid fa-language"></i>
                        <div>
                            <div class="ai-card-title">Translate to MY</div>
                            <small class="text-muted">English to Myanmar</small>
                        </div>
                    </div>

                    <div class="ai-card" data-action="grammar">
                        <i class="fa-solid fa-spell-check"></i>
                        <div>
                            <div class="ai-card-title">Fix Typos</div>
                            <small class="text-muted">Correct OCR errors</small>
                        </div>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 0.5rem;">
                    <label class="form-label" for="ai-custom-prompt">Custom AI Prompt</label>
                    <div style="display: flex; gap: 0.5rem;">
                        <input type="text" class="form-input" id="ai-custom-prompt" placeholder="Ask AI anything about the extracted text...">
                        <button class="btn btn-primary" id="btn-ai-submit">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group" style="flex: 1; margin-top: 0.5rem;">
                    <label class="form-label">AI Output Result</label>
                    <textarea class="editor-textarea" id="ai-result-text" placeholder="AI results will be displayed here..." readonly></textarea>
                </div>
            </div>

        </section>
    </main>

    <!-- Crop Image Modal -->
    <div class="modal-backdrop" id="modal-crop">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fa-solid fa-crop-simple me-2"></i>Crop Image</h3>
                <button class="btn-icon" id="btn-close-crop"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="crop-wrapper">
                    <img id="cropper-image" src="" alt="Crop image">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-icon" id="btn-rotate-left" title="Rotate Left"><i class="fa-solid fa-rotate-left"></i></button>
                <button class="btn-icon" id="btn-rotate-right" title="Rotate Right"><i class="fa-solid fa-rotate-right"></i></button>
                <button class="btn btn-secondary" id="btn-reset-crop">Reset</button>
                <button class="btn btn-primary" id="btn-apply-crop">Apply Crop</button>
            </div>
        </div>
    </div>

    <!-- History Modal Drawer -->
    <div class="modal-backdrop" id="modal-history">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fa-solid fa-clock-rotate-left me-2"></i>Scan History</h3>
                <button class="btn-icon" id="btn-close-history"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="history-list" id="history-container"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" id="btn-clear-history">
                    <i class="fa-solid fa-trash-can me-1"></i> Clear History
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Cropper.js Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <!-- Main Logic Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const state = {
                currentImageBlob: null,
                currentImageURL: null,
                cropperInstance: null,
                history: JSON.parse(localStorage.getItem('myanmar_ocr_history') || '[]'),
                theme: localStorage.getItem('theme') || 'light'
            };

            const elements = {
                html: document.documentElement,
                btnTheme: document.getElementById('btn-theme'),
                dropzone: document.getElementById('dropzone'),
                fileInput: document.getElementById('file-input'),
                previewBox: document.getElementById('preview-box'),
                imagePreview: document.getElementById('image-preview'),
                btnRemoveImage: document.getElementById('btn-remove-image'),
                btnScan: document.getElementById('btn-scan'),
                scanBtnText: document.getElementById('scan-btn-text'),
                editorText: document.getElementById('editor-text'),
                statWords: document.getElementById('stat-words'),
                statChars: document.getElementById('stat-chars'),
                statMyaChars: document.getElementById('stat-mya-chars'),
                btnCopy: document.getElementById('btn-copy'),
                btnSpeak: document.getElementById('btn-speak'),
                btnClearText: document.getElementById('btn-clear-text'),
                btnExportTxt: document.getElementById('btn-export-txt'),
                btnExportDocx: document.getElementById('btn-export-docx'),
                btnExportPdf: document.getElementById('btn-export-pdf'),
                modalCrop: document.getElementById('modal-crop'),
                btnCropModal: document.getElementById('btn-crop-modal'),
                cropperImage: document.getElementById('cropper-image'),
                btnCloseCrop: document.getElementById('btn-close-crop'),
                btnRotateLeft: document.getElementById('btn-rotate-left'),
                btnRotateRight: document.getElementById('btn-rotate-right'),
                btnResetCrop: document.getElementById('btn-reset-crop'),
                btnApplyCrop: document.getElementById('btn-apply-crop'),
                btnHistory: document.getElementById('btn-history'),
                modalHistory: document.getElementById('modal-history'),
                btnCloseHistory: document.getElementById('btn-close-history'),
                historyContainer: document.getElementById('history-container'),
                btnClearHistory: document.getElementById('btn-clear-history'),
                tabBtns: document.querySelectorAll('.tab-btn'),
                tabContents: document.querySelectorAll('.tab-content'),
                aiCards: document.querySelectorAll('.ai-card'),
                aiCustomPrompt: document.getElementById('ai-custom-prompt'),
                btnAiSubmit: document.getElementById('btn-ai-submit'),
                aiResultText: document.getElementById('ai-result-text'),
                toastContainer: document.getElementById('toast-container')
            };

            // Theme Management
            function initTheme() {
                elements.html.setAttribute('data-theme', state.theme);
                elements.btnTheme.querySelector('i').className = state.theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            }
            elements.btnTheme.addEventListener('click', () => {
                state.theme = state.theme === 'light' ? 'dark' : 'light';
                localStorage.setItem('theme', state.theme);
                initTheme();
            });
            initTheme();

            // Toast Notifications
            function showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                let icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info';
                toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
                elements.toastContainer.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            // Image Upload Logic
            elements.dropzone.addEventListener('click', () => elements.fileInput.click());
            elements.dropzone.addEventListener('dragover', (e) => { e.preventDefault(); elements.dropzone.classList.add('dragover'); });
            ['dragleave', 'dragend'].forEach(ev => elements.dropzone.addEventListener(ev, () => elements.dropzone.classList.remove('dragover')));
            elements.dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                elements.dropzone.classList.remove('dragover');
                if (e.dataTransfer.files.length) handleImageFile(e.dataTransfer.files[0]);
            });
            elements.fileInput.addEventListener('change', (e) => {
                if (e.target.files.length) handleImageFile(e.target.files[0]);
            });

            function handleImageFile(file) {
                if (!file.type.startsWith('image/')) return showToast('Please select a valid image file', 'error');
                state.currentImageBlob = file;
                if (state.currentImageURL) URL.revokeObjectURL(state.currentImageURL);
                state.currentImageURL = URL.createObjectURL(file);
                elements.imagePreview.src = state.currentImageURL;
                elements.previewBox.style.display = 'block';
                elements.dropzone.style.display = 'none';
                showToast('Image loaded successfully', 'success');
            }

            elements.btnRemoveImage.addEventListener('click', () => {
                state.currentImageBlob = null;
                elements.previewBox.style.display = 'none';
                elements.dropzone.style.display = 'flex';
                elements.fileInput.value = '';
            });

            // Cropper Logic
            elements.btnCropModal.addEventListener('click', () => {
                if (!state.currentImageURL) return;
                elements.cropperImage.src = state.currentImageURL;
                elements.modalCrop.classList.add('active');
                if (state.cropperInstance) state.cropperInstance.destroy();
                state.cropperInstance = new Cropper(elements.cropperImage, { viewMode: 1, responsive: true });
            });

            function closeCropModal() {
                elements.modalCrop.classList.remove('active');
                if (state.cropperInstance) { state.cropperInstance.destroy(); state.cropperInstance = null; }
            }
            elements.btnCloseCrop.addEventListener('click', closeCropModal);
            elements.btnRotateLeft.addEventListener('click', () => state.cropperInstance && state.cropperInstance.rotate(-90));
            elements.btnRotateRight.addEventListener('click', () => state.cropperInstance && state.cropperInstance.rotate(90));
            elements.btnResetCrop.addEventListener('click', () => state.cropperInstance && state.cropperInstance.reset());
            elements.btnApplyCrop.addEventListener('click', () => {
                if (!state.cropperInstance) return;
                state.cropperInstance.getCroppedCanvas().toBlob((blob) => {
                    state.currentImageBlob = blob;
                    state.currentImageURL = URL.createObjectURL(blob);
                    elements.imagePreview.src = state.currentImageURL;
                    closeCropModal();
                    showToast('Cropped image applied', 'success');
                });
            });

            // OCR Demo Execution
            elements.btnScan.addEventListener('click', async () => {
                if (!state.currentImageBlob) return showToast('Please upload an image first', 'warning');
                
                elements.btnScan.disabled = true;
                elements.scanBtnText.innerText = 'Scanning...';
                const originalIcon = elements.btnScan.querySelector('i').className;
                elements.btnScan.querySelector('i').className = 'spinner';

                setTimeout(() => {
                    const sampleText = "မင်္ဂလာပါရှင်။ Myanmar OCR Scanner မှ ကြိုဆိုပါသည်...\nThis text was successfully extracted from your document.\n\nဖုန်း သို့မဟုတ် ကွန်ပျူတာ အလွယ်တကူ responsive အသုံးပြုနိုင်ပါသည်။";
                    elements.editorText.value = sampleText;
                    updateTextStats();
                    saveHistory(sampleText);

                    elements.btnScan.disabled = false;
                    elements.scanBtnText.innerText = 'Extract Text (OCR)';
                    elements.btnScan.querySelector('i').className = originalIcon;
                    showToast('OCR Text Extracted!', 'success');
                }, 1500);
            });

            // Text Stats Counter
            function updateTextStats() {
                const text = elements.editorText.value || '';
                const words = text.trim() ? text.trim().split(/\s+/).length : 0;
                const chars = text.length;
                const myanmarChars = (text.match(/[\u1000-\u109F\uAA60-\uAA7F]/g) || []).length;

                elements.statWords.innerText = `Words: ${words}`;
                elements.statChars.innerText = `Characters: ${chars}`;
                elements.statMyaChars.innerText = `Myanmar Chars: ${myanmarChars}`;
            }
            elements.editorText.addEventListener('input', updateTextStats);

            // Editor Actions
            elements.btnCopy.addEventListener('click', () => {
                navigator.clipboard.writeText(elements.editorText.value);
                showToast('Text copied to clipboard', 'info');
            });

            elements.btnClearText.addEventListener('click', () => {
                elements.editorText.value = '';
                updateTextStats();
            });

            elements.btnSpeak.addEventListener('click', () => {
                if (!elements.editorText.value) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(elements.editorText.value);
                window.speechSynthesis.speak(utterance);
            });

            // Export Actions
            elements.btnExportTxt.addEventListener('click', () => {
                const blob = new Blob([elements.editorText.value], { type: 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'extracted-text.txt';
                a.click();
            });

            // Tab Switching
            elements.tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    elements.tabBtns.forEach(b => b.classList.remove('active'));
                    elements.tabContents.forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(btn.dataset.tab).classList.add('active');
                });
            });

            // AI Actions Logic
            elements.aiCards.forEach(card => card.addEventListener('click', () => runAI(card.dataset.action)));
            elements.btnAiSubmit.addEventListener('click', () => runAI('custom', elements.aiCustomPrompt.value));

            function runAI(action, customText = '') {
                if (!elements.editorText.value) return showToast('No text available for AI processing', 'warning');
                elements.aiResultText.value = 'AI processing...';
                setTimeout(() => {
                    if (action === 'summarize') elements.aiResultText.value = 'Summary:\n- Document successfully processed.\n- Multi-lingual capability verified.';
                    else if (action === 'translate_en') elements.aiResultText.value = 'English Translation:\nHello! Welcome to Myanmar OCR Scanner...';
                    else elements.aiResultText.value = `AI Response for (${action}):\n` + elements.editorText.value;
                    showToast('AI Task Completed', 'success');
                }, 1000);
            }

            // History Drawer Logic
            elements.btnHistory.addEventListener('click', () => {
                renderHistory();
                elements.modalHistory.classList.add('active');
            });
            elements.btnCloseHistory.addEventListener('click', () => elements.modalHistory.classList.remove('active'));

            function saveHistory(text) {
                state.history.unshift({ text, date: new Date().toLocaleString() });
                if (state.history.length > 15) state.history.pop();
                localStorage.setItem('myanmar_ocr_history', JSON.stringify(state.history));
            }

            function renderHistory() {
                elements.historyContainer.innerHTML = '';
                if (!state.history.length) {
                    elements.historyContainer.innerHTML = '<p style="text-align:center; color: var(--text-muted);">No scan history found.</p>';
                    return;
                }
                state.history.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'history-item';
                    div.innerHTML = `
                        <div class="history-info">
                            <div class="history-title">${item.text.slice(0, 40)}...</div>
                            <div class="history-date">${item.date}</div>
                        </div>
                        <button class="btn-icon"><i class="fa-solid fa-arrow-right"></i></button>
                    `;
                    div.addEventListener('click', () => {
                        elements.editorText.value = item.text;
                        updateTextStats();
                        elements.modalHistory.classList.remove('active');
                    });
                    elements.historyContainer.appendChild(div);
                });
            }

            elements.btnClearHistory.addEventListener('click', () => {
                state.history = [];
                localStorage.removeItem('myanmar_ocr_history');
                renderHistory();
            });
        });
    </script>
</body>
</html>
